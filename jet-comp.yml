version: '3.8'

services:
  client:
    image: revchenkov/compvis-test_solution:v0.4_jet
    build:
      context: test-solution
      dockerfile: Dockerfile_jet
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
       - /dev/video0:/dev/video0
    volumes:
       - /tmp/argus_socket:/tmp/argus_socket
       - /home/user/compvis/UAV_Docker/test-solution/container_output:/app/container_output
    privileged: true
